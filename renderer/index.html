<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixie</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="asleep">
<video id="cam" playsinline muted></video>
<canvas id="bg"></canvas>

<!-- Dashboard: settings, Pixie, her background, camera preview, chat box -->
<main id="app">
  <section id="stage" aria-label="Pixie">
    <div id="halo"><div class="disc"></div><i class="ring"></i><i class="ring2"></i><div class="orbit o1"><b>✦</b></div><div class="orbit o2"><b>♥</b></div><div class="orbit o3"><b>✧</b></div></div>
    <div id="char"><img id="sprA" class="spr on" alt="Pixie" draggable="false" src="app://pixie/assets/emotions/sleepy.png"><img id="sprB" class="spr" alt="" draggable="false"><img id="sprM" class="spr m" alt="" draggable="false"><svg id="mouth" class="spr-svg" preserveAspectRatio="xMidYMax meet" viewBox="0 0 300 300"><defs><clipPath id="mClip"><path id="mClipP"/></clipPath></defs><path id="mFill" fill="#df6a7a" stroke="#74404c" stroke-linejoin="round"/><ellipse id="mTongue" fill="#f7a0ac" clip-path="url(#mClip)"/><rect id="mTeeth" fill="#fff8f6" clip-path="url(#mClip)"/><path id="mLine" fill="none" stroke="#74404c" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div id="prop"></div>
    <div id="fx"></div>
  </section>
  <div id="caption" role="status" aria-live="polite"><span id="capText"></span><span id="confirmBtns" hidden><button data-yn="1">Yes</button><button data-yn="0">No</button></span></div>
  <canvas id="preview" width="76" height="76" hidden title="Camera preview"></canvas>
  <form id="chat" autocomplete="off">
    <button type="button" id="micDot" class="off" aria-label="Microphone status"></button>
    <input id="chatInput" type="text" placeholder="Ask Pixie anything…" aria-label="Ask Pixie">
    <button type="submit" id="send" aria-label="Send"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg></button>
  </form>
  <button id="sideBtn" aria-label="Chats" aria-expanded="false" title="Chats"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="4"/><path d="M9 4v16"/><path d="M5.8 8.5h.01M5.8 11.5h.01"/></svg></button>
  <aside id="sidebar" aria-label="Chats">
    <div class="sb-top"><button id="newChat" class="sb-new"><span>＋</span> New chat</button></div>
    <label class="sb-search"><input id="chatSearch" type="text" placeholder="Search chats" aria-label="Search chats"></label>
    <div class="sb-label">Chat history</div>
    <div id="chatList" role="list"></div>
  </aside>
  <section id="transcript" aria-label="Conversation"><header><b id="trTitle">New chat</b><span id="trCount"></span></header><div id="msgs"></div></section>
  <div id="settingsWrap">
    <button id="gear" aria-haspopup="true" aria-expanded="false" title="Settings">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
    <div id="menu" hidden></div>
  </div>
</main>

<!-- Dynamic island: minimal, short replies, full agent -->
<div id="island" class="compact">
  <div class="av"><img data-char alt="" draggable="false" src="app://pixie/assets/emotions/peaceful.png"></div>
  <div class="body">
    <div class="row"><span id="islandText">Say “Hello Pixie”</span><i id="islandDot" class="off"></i></div>
    <div class="more"><span id="islandYN" hidden><button data-yn="1">Yes</button><button data-yn="0">No</button></span><form id="islandForm" autocomplete="off"><input id="islandInput" placeholder="Ask Pixie…" aria-label="Ask Pixie"><button type="submit" aria-label="Send">➤</button></form></div>
  </div>
  <button id="islandRestore" title="Open Pixie" aria-label="Open Pixie"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></button>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
