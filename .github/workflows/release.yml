name: Build Windows installer
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Verify vision models were bundled
        shell: bash
        run: |
          ls -la renderer/vendor renderer/vendor/models
          test -s renderer/vendor/models/hand_landmarker.task
          test -s renderer/vendor/models/face_landmarker.task
          test -s renderer/vendor/vision_bundle.mjs
          test -s renderer/vendor/vision_bundle.cjs
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Pixie-Setup
          path: dist/*.exe
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
